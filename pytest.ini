[pytest]
testpaths = tests
addopts = -q --tb=short

# Put the repo root on sys.path so `from app...` resolves.
#
# WITHOUT THIS, the suite passes locally and fails in CI:
#   python -m pytest   inserts the current directory into sys.path -> works
#   pytest             (console script) does NOT               -> ModuleNotFoundError
#
# That is exactly how the first CI run broke: 30 tests green locally, 4
# collection errors on the runner. Setting it here makes both invocations
# behave identically, rather than relying on how you happened to launch it.
pythonpath = .

# Tests must never touch the network, an LLM, or Qdrant: they run on every
# commit, so they have to be fast, free and deterministic.
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
